<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Hub</title>
<style>
  :root { --bg:#111418; --card:#1b2027; --txt:#e6e9ee; --sub:#8b95a3; --acc:#6aa9ff; --ok:#4cc38a; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--sub); margin:0 0 20px; }
  .card { background:var(--card); border-radius:10px; padding:16px; margin-bottom:16px; }
  .modos { display:flex; gap:8px; flex-wrap:wrap; }
  button { background:#262d36; color:var(--txt); border:1px solid #333b46; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  button.ativo { background:var(--acc); color:#08111f; border-color:var(--acc); font-weight:600; }
  .modelo { display:flex; justify-content:space-between; align-items:center; padding:10px; border-radius:8px; cursor:pointer; }
  .modelo:hover { background:#232a33; } .modelo.ativo { outline:2px solid var(--ok); }
  .info { color:var(--sub); font-size:13px; } .vazio { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>Model Hub</h1>
  <p class="sub">Endereço para usar em tudo: <b>http://localhost:4000</b></p>

  <div class="card">
    <b>Modo</b>
    <p class="info">Auto = usa o Claude e troca para o modelo local quando os tokens acabam.</p>
    <div class="modos">
      <button data-modo="auto">Auto</button>
      <button data-modo="claude">Só Claude</button>
      <button data-modo="local">Só local</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Modelos locais</b><button id="scan">Procurar agora</button>
    </div>
    <p class="info">Clique para escolher qual modelo local será usado. Modelos novos aparecem sozinhos.</p>
    <div id="lista"></div>
  </div>

  <div class="card info" id="uso">Nenhum pedido ainda.</div>
</main>
<script>
async function api(url, dados) {
  const r = await fetch(url, dados ? {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(dados)} : {});
  return r.json();
}
function desenhar(e) {
  document.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("ativo", b.dataset.modo === e.modo));
  const lista = document.getElementById("lista");
  lista.innerHTML = e.modelos.length ? "" : '<p class="vazio">Nenhum modelo encontrado. O Ollama está aberto?</p>';
  for (const m of e.modelos) {
    const d = document.createElement("div");
    d.className = "modelo" + (m.nome === e.modelo_local ? " ativo" : "");
    d.innerHTML = `<span>${m.nome}</span><span class="info">${m.detalhes} · ${m.tamanho_gb} GB</span>`;
    d.onclick = () => api("/api/selecionar", {modelo_local: m.nome}).then(desenhar);
    lista.appendChild(d);
  }
  if (e.ultimo_uso.modelo) document.getElementById("uso").textContent = `Último pedido: ${e.ultimo_uso.modelo} às ${e.ultimo_uso.quando}`;
}
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => api("/api/selecionar", {modo: b.dataset.modo}).then(desenhar));
document.getElementById("scan").onclick = () => api("/api/escanear", {}).then(desenhar);
const atualizar = () => api("/api/estado").then(desenhar).catch(() => {});
atualizar(); setInterval(atualizar, 5000);
</script>
</body>
</html>
